# Mode A discovery sources.
# Each entry is a faculty/group directory page to scrape.
# robots.txt is honoured unless you set RESPECT_ROBOTS=false in .env.
#
# TIP: prefer GROUP pages that carry research blurbs over bare staff tables.
# Rows with no research text are rejected before the LLM, since a
# "personalized" email written from "Research Associate, CMS, Room 511b"
# is neither personal nor worth the tokens.


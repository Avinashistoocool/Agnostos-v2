[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnostos"
version = "2.0.0"
description = "Resume-driven academic outreach: match professors, draft humanised cold emails, send them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avinash Chandra Gupta" }]
keywords = ["academic", "outreach", "cold-email", "llm", "groq", "research-internship"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "PyYAML>=6.0",
    "certifi>=2024.2.2",
    "truststore>=0.9.0",
]

[project.optional-dependencies]
scrape = ["playwright>=1.45.0"]

[project.urls]
Homepage = "https://github.com/Avinashistoocool/Agnostos-v2"
Issues = "https://github.com/Avinashistoocool/Agnostos-v2/issues"

[project.scripts]
agnostos = "outreach.cli:main"

[tool.setuptools]
packages = ["outreach"]

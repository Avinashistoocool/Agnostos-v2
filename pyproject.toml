[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agnostos"
dynamic = ["version"]
description = "Resume-driven academic outreach: match professors, draft humanised cold emails, send them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Avinash Chandra Gupta" }]
keywords = ["academic", "outreach", "cold-email", "llm", "groq", "research-internship"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = [
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "ruamel.yaml>=0.18,<0.20",
    "certifi>=2024.2.2",
    "tzdata>=2025.2",
    "truststore>=0.9.0",
    "httpx>=0.27",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
scrape = ["playwright>=1.45.0"]
calendar = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]

[project.urls]
Homepage = "https://github.com/Avinashistoocool/Agnostos-v2"
Changelog = "https://github.com/Avinashistoocool/Agnostos-v2/blob/main/CHANGELOG.md"
Issues = "https://github.com/Avinashistoocool/Agnostos-v2/issues"

[project.scripts]
agnostos = "outreach.cli:main"

[tool.setuptools]
packages = ["outreach"]

[tool.setuptools.dynamic]
version = { attr = "outreach.__version__" }

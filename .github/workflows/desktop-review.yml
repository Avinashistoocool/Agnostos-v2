name: Native Windows desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-review-requirements.txt
      - name: Build native desktop application
        shell: pwsh
        run: .\build-desktop-review.ps1 -Python python
      - name: Test native widgets, command safety and package
        shell: pwsh
        run: |
          python tests\native_desktop_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\full_desktop_contract_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\legacy_live_guard_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\check_desktop_review_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Agnostos-v2-Desktop-Windows
          path: dist\Agnostos-v2-Desktop.zip
          if-no-files-found: error
          retention-days: 14

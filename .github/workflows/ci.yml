name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab

      - name: Build test fixtures
        run: python tests/make_fixtures.py

      # No .env exists in CI, so both suites fall back to the fixtures and
      # run entirely offline: the LLM is mocked and no mail is ever sent.
      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Provider integration test
        run: python tests/openai_stub_test.py

      - name: YAML source and resume path tests
        run: |
          python tests/yaml_sources_test.py
          python tests/resume_path_test.py

  windows-315:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
          cache: pip

      - name: Install using wheels only (no Visual C++ build tools)
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r requirements.txt reportlab
          exit $LASTEXITCODE

      - name: Build test fixtures
        run: python tests/make_fixtures.py

      - name: Verify YAML, resume parsing and email pipeline
        run: |
          python tests/yaml_sources_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/resume_path_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/openai_stub_test.py
          exit $LASTEXITCODE
